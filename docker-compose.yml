services:
  app:
    build:
      context: .
      target: prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET: change-me-on-the-pi
      APP_SHARE_DIR: var/share
      DATABASE_URL: "mysql://${MYSQL_USER:-sym_notes}:${MYSQL_PASSWORD:-sym_notes}@db:3306/${MYSQL_DATABASE:-sym_notes}?charset=utf8mb4&serverVersion=9.7"
      DEFAULT_URI: http://localhost:3444
      MCP_TOKEN: "${MCP_TOKEN:-}"
      MCP_USER_EMAIL: "${MCP_USER_EMAIL:-}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-192.168.0.25,localhost,127.0.0.1}"
    ports:
      - "0.0.0.0:3444:8000"
    volumes:
      - note-attachments:/app/var/uploads/notes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tools:
    build:
      context: .
      target: tools
    profiles:
      - tools
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET: dev-tools
      APP_SHARE_DIR: var/share
      DATABASE_URL: "mysql://${MYSQL_USER:-sym_notes}:${MYSQL_PASSWORD:-sym_notes}@db:3306/${MYSQL_DATABASE:-sym_notes}?charset=utf8mb4&serverVersion=9.7"
      DEFAULT_URI: http://localhost:3444
      MCP_TOKEN: "${MCP_TOKEN:-}"
      MCP_USER_EMAIL: "${MCP_USER_EMAIL:-}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-192.168.0.25,localhost,127.0.0.1}"
    volumes:
      - .:/app
      - tools-vendor:/app/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:9
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sym_notes}
      MYSQL_USER: ${MYSQL_USER:-sym_notes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sym_notes}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sym_notes_root}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  mysql-data:
  note-attachments:
  tools-vendor:
