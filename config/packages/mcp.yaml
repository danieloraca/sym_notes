mcp:
    servers:
        notes:
            name: sym-notes
            version: 1.0.0
            description: Read and manage notes belonging to the authenticated Sym Notes user.
            instructions: >
                When asked to create or manage Sym Notes, always use these MCP tools.
                Resolve folder names with folders_list, then pass the folder ID to
                notes_create. Never create local files or directories.
            transports:
                http: true
                stdio: false
            http:
                path: /mcp
                allowed_hosts: '%env(csv:MCP_ALLOWED_HOSTS)%'
            registry:
                tools:
                    - 'App\Notes\Presentation\Mcp\'
